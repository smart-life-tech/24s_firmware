[platformio]
default_envs = smarthub

[env:smarthub]
platform = espressif32@7.1.3
board = esp32-s2-saola-1
framework = espidf

monitor_speed = 115200
upload_speed = 921600

build_type = debug

build_flags =
    -DCONFIG_DEVICE_ID=\"24S-HUB-001\"
    -DCONFIG_MQTT_BROKER_URI=\"mqtt://YOUR_BROKER:1883\"

board_build.mcu = esp32s2
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB

monitor_filters =
    esp32_exception_decoder

lib_ldf_mode = chain+