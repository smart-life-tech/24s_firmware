; PlatformIO project configuration for the ESP-IDF-based 24S firmware
[env:s3-test]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200
upload_speed = 921600
build_type = debug

board_build.partitions = partitions.csv

build_flags =
    -DCONFIG_DEVICE_ID=\"24S-S3-TEST\"
    -DCONFIG_MQTT_BROKER_URI=\"mqtt://10.208.47.228:1883\"

monitor_filters =
    esp32_exception_decoder

[env:24s]
platform = espressif32@6.13.0
board = esp32-s2-saola-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
build_type = debug
board_build.partitions = partitions.csv

build_flags =
    -DCONFIG_DEVICE_ID=\"24S-HUB-001\"
    -DCONFIG_MQTT_BROKER_URI=\"mqtt://192.168.1.100:1883\"

monitor_filters =
    esp32_exception_decoder

lib_deps =

lib_ldf_mode = chain+