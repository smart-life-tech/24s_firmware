; PlatformIO project configuration for the ESP-IDF-based 24S firmware

[env:24s]
platform = espressif32@6.13.0
board = esp32-s2-saola-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
build_type = debug
board_build.partitions = partitions.csv

build_flags =
    -DCONFIG_DEVICE_ID=\"24S-HUB-001\"
    -DCONFIG_MQTT_BROKER_URI=\"mqtt://broker.local:1883\"

monitor_filters =
    esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

lib_ldf_mode = chain+