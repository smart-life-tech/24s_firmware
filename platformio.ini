; PlatformIO project configuration for the ESP-IDF-based 24S firmware
[env:24s]
platform = espressif32@6.13.0
board = esp32-s2-saola-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
build_type = release
board_build.partitions = partitions.csv

; CONFIG_DEVICE_ID should ideally be provisioned per unit (NVS) rather than
; hardcoded here; CONFIG_MQTT_BROKER_URI is loaded from NVS at runtime.
build_flags =
    -DCONFIG_DEVICE_ID=\"24S-HUB-001\"

monitor_filters =
    esp32_exception_decoder

lib_deps =

lib_ldf_mode = chain+